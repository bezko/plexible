#!/usr/sbin/nft -f
# Plex local spoofing rules
# Redirect traffic from proxy interface to local proxy making requests from LAN IP

table ip plex_local {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Adjust interface and IPs for your setup
        # iifname "tailscale0" ip saddr <PROXY_SUBNET> tcp dport 32400 dnat to 127.0.0.1:32402
        # iifname "tailscale0" ip saddr <PROXY_SUBNET> tcp dport 32469 dnat to 127.0.0.1:32402
    }
}
